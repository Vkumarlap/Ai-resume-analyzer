server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

gemini:
  # Never commit your real key. Set it as an environment variable before starting the app:
  #   export GEMINI_API_KEY=your-real-key-here
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.1-flash-lite
  

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.airesume.analyzer: INFO
